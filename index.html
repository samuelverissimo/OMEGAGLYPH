<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSMISSÃO - CONEXÃO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app">
        <section id="authSection" class="card">
            <h1>TRANSMISSÃO</h1>

            <div class="toggle">
                <button type="button" class="toggle-btn active" data-mode="login">Entrar</button>
                <button type="button" class="toggle-btn" data-mode="register">Cadastrar</button>
            </div>

            <form id="authForm">
                <label>
                    Nome
                    <input id="nameInput" type="text" placeholder="Digite seu nome" required>
                </label>

                <label>
                    Senha
                    <input id="passwordInput" type="password" placeholder="Digite sua senha" required>
                </label>

                <button id="authSubmit" type="submit">Entrar</button>
            </form>

            <p id="authMessage" class="message"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
